<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Subtle glow beneath cap -->
  <ellipse cx="256" cy="240" rx="140" ry="70" fill="#6366F1" opacity="0.25" filter="url(#glow)"/>

  <!-- Academic Cap Top Diamond -->
  <path d="M256 128 L432 208 L256 288 L80 208 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <path d="M256 138 L416 210 L256 280 L96 210 Z" fill="#4338CA" opacity="0.4"/>

  <!-- Cap Crown / Headpiece Base -->
  <path d="M152 248 V316 C152 352 198 384 256 384 C314 384 360 352 360 316 V248 L256 296 Z" fill="url(#primaryGrad)"/>

  <!-- Tassel Cord & Pendant -->
  <path d="M256 208 C360 216 410 260 416 320" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
  <circle cx="416" cy="336" r="14" fill="#F59E0B"/>
  <path d="M410 348 L416 392 L422 348 Z" fill="#F59E0B"/>

  <!-- Emerald Data Trend Spark (GPA Accent) -->
  <circle cx="256" cy="208" r="14" fill="url(#accentGrad)"/>
  
  <!-- Mini GPA bars base -->
  <rect x="208" y="416" width="24" height="32" rx="6" fill="#64748B" opacity="0.7"/>
  <rect x="244" y="400" width="24" height="48" rx="6" fill="#818CF8"/>
  <rect x="280" y="384" width="24" height="64" rx="6" fill="url(#accentGrad)"/>
</svg>
