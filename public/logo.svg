<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="logoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Squircle (48x48) -->
  <g transform="translate(8, 8)">
    <rect width="48" height="48" rx="14" fill="url(#logoBgGrad)"/>
    <!-- Graduation Cap -->
    <path d="M24 14 L40 21 L24 28 L8 21 Z" fill="url(#logoPrimaryGrad)"/>
    <path d="M15 25 V31 C15 34.5 19 37 24 37 C29 37 33 34.5 33 31 V25 L24 29.5 Z" fill="url(#logoPrimaryGrad)" opacity="0.9"/>
    <!-- Tassel -->
    <path d="M24 21 C33 22 37 26 38 31" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="38" cy="32" r="1.5" fill="#F59E0B"/>
    <!-- GPA Spark -->
    <circle cx="24" cy="21" r="2" fill="url(#logoAccentGrad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#F4F4F5" letter-spacing="-0.02em">
    CIS GPA Portal
  </text>
  
  <text x="68" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#94A3B8" letter-spacing="0.01em">
    BSc (Hons) CIS / IS • Sabaragamuwa
  </text>
</svg>
